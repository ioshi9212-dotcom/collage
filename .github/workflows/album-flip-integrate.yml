name: Integrate album flip preview

on:
  push:
    branches:
      - feature/album-flip-preview
    paths:
      - .github/workflows/album-flip-integrate.yml

permissions:
  contents: write

jobs:
  integrate:
    if: github.event.head_commit.message == 'Integrate album flip preview into editor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/album-flip-preview
          fetch-depth: 0

      - name: Patch editor integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/AppLive.jsx')
          source = path.read_text(encoding='utf-8')

          import_anchor = "import CollagePresetPicker from './editor/CollagePresetPicker';"
          import_line = "import AlbumFlipPreview from './editor/AlbumFlipPreview';"
          if import_line not in source:
            if import_anchor not in source:
              raise SystemExit('AppLive import anchor not found')
            source = source.replace(import_anchor, import_anchor + "\n" + import_line, 1)

          state_anchor = "  const [exportMenuOpen, setExportMenuOpen] = useState(false);"
          state_line = "  const [albumFlipOpen, setAlbumFlipOpen] = useState(false);"
          if state_line not in source:
            if state_anchor not in source:
              raise SystemExit('AppLive state anchor not found')
            source = source.replace(state_anchor, state_anchor + "\n" + state_line, 1)

          render_anchor = "  const renderEntries = entries.map((entry, entryIndex) => ("
          render_block = '''  const albumFlipRenderWidth = 520;
          const albumFlipRenderHeight = Math.max(1, Math.round(albumFlipRenderWidth * canvas.height / Math.max(1, canvas.width)));
          const albumFlipRenderScale = albumFlipRenderWidth / Math.max(1, canvas.width);

          function renderAlbumFlipPage(pageIndex) {
            const page = pages[pageIndex];
            if (!page) return null;
            return (
              <Stage
                className="album-flip-stage"
                width={albumFlipRenderWidth}
                height={albumFlipRenderHeight}
                scaleX={albumFlipRenderScale}
                scaleY={albumFlipRenderScale}
                listening={false}
              >
                <Layer listening={false}>
                  <PageLayer
                    page={page}
                    pageIndex={pageIndex}
                    x={0}
                    y={0}
                    canvas={canvas}
                    settings={settings}
                    activePageId={null}
                    selectedFrameId={null}
                    moveFrameWithPhotoId={null}
                    smartSnap={false}
                    printMode
                    collagePreviewOnly
                  />
                  <ExtraPageLayers extraLayers={extraLayers} pageIndex={pageIndex} x={0} y={0} printMode />
                  <PageNumberLayer pageIndex={pageIndex} canvas={canvas} settings={pageNumbering} />
                </Layer>
              </Stage>
            );
          }

          '''
          if 'function renderAlbumFlipPage(pageIndex)' not in source:
            if render_anchor not in source:
              raise SystemExit('AppLive render anchor not found')
            source = source.replace(render_anchor, render_block + render_anchor, 1)

          button_anchor = '          <button className="button" type="button" onClick={loadSaved}>Открыть</button>'
          button_line = '          <button className="button album-flip-open-button" type="button" onClick={() => { setExportMenuOpen(false); setAlbumFlipOpen(true); }}>Листать альбом</button>'
          if button_line not in source:
            if button_anchor not in source:
              raise SystemExit('AppLive toolbar anchor not found')
            source = source.replace(button_anchor, button_anchor + "\n" + button_line, 1)

          modal_anchor = '      {exportStagesActive && <div className="export-stage-holder" aria-hidden="true">'
          modal_block = '''      <AlbumFlipPreview
                open={albumFlipOpen}
                pageCount={pages.length}
                startPageIndex={currentPageIndex}
                pageAspect={canvas.width / Math.max(1, canvas.height)}
                renderPage={renderAlbumFlipPage}
                onClose={() => setAlbumFlipOpen(false)}
              />

          '''
          if '<AlbumFlipPreview' not in source:
            if modal_anchor not in source:
              raise SystemExit('AppLive modal anchor not found')
            source = source.replace(modal_anchor, modal_block + modal_anchor, 1)

          path.write_text(source, encoding='utf-8')
          PY

          npm test
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/album-flip-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppLive.jsx .github/workflows/album-flip-integrate.yml
          git commit -m "Integrate 3D album page flipping"
          git push origin HEAD:feature/album-flip-preview
