name: Fix booklet PDF text readiness

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-booklet-pdf-text-readiness.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/patch-booklet-pdf-text-readiness.mjs
      - run: git rm scripts/patch-booklet-pdf-text-readiness.mjs
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium
      - run: npx playwright test e2e/booklet-print.spec.js
      - name: Commit verified fix
        run: |
          git rm .github/workflows/fix-booklet-pdf-text-readiness.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppLive.jsx src/editor/appIntegration.test.mjs
          git commit -m 'Wait for booklet text before PDF rasterization'
          git push
