name: Apply compact photo library panel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-photo-library-panel.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply photo panel patch
        run: node scripts/patch-photo-library-panel-v2.mjs
      - name: Update photo panel integration contract
        run: node scripts/patch-photo-library-contract.mjs
      - name: Remove one-time patch helpers
        run: git rm scripts/patch-photo-library-panel.mjs scripts/patch-photo-library-panel-v2.mjs scripts/patch-photo-library-contract.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run photo panel regressions
        run: npx playwright test e2e/photo-library-tabs.spec.js e2e/photo-import-report.spec.js e2e/photo-duplicate-upload.spec.js
      - name: Commit verified panel and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-photo-library-panel.yml
          git add src/AppLive.jsx src/main.jsx src/photo-library-panel.css src/editor/appIntegration.test.mjs e2e/photo-library-tabs.spec.js
          git commit -m 'Compact photo library and add usage tabs'
          git push
