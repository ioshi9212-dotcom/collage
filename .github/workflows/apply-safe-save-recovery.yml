name: Apply safe save recovery

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-safe-save-recovery.mjs'
      - '.github/workflows/apply-safe-save-recovery.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply safe-save migration
        run: node scripts/apply-safe-save-recovery.mjs
      - name: Remove obsolete force-create branch
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const authPath = 'public/cloud-auth.js';
          let auth = fs.readFileSync(authPath, 'utf8');
          auth = auth.replace(
            "  async function saveCloud(options = {}) {\n    if (state.busy) return;\n    const forceCreate = options?.forceCreate === true;\n",
            "  async function saveCloud() {\n    if (state.busy) return;\n",
          );
          auth = auth.replace('    await saveCloud({ forceCreate: true });', '    await saveCloud();');
          fs.writeFileSync(authPath, auth);

          const testPath = 'tests/cloud-auth.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          test = test.replace(
            'assert.match(saveAsNewBody, /saveCloud\\(\\{\\s*forceCreate:\\s*true\\s*\\}\\)/);',
            'assert.match(saveAsNewBody, /saveCloud\\(\\)/);',
          );
          fs.writeFileSync(testPath, test);
          NODE
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified implementation and clean helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-safe-save-recovery.mjs .github/workflows/apply-safe-save-recovery.yml
          git add server.js server/projectVersioning.js server/projectVersioning.test.mjs server/safeProjectVersions.js server/safeProjectVersions.test.mjs src/editor/cloudProjects.js public/cloud-auth.js tests/cloud-auth.test.mjs package.json
          git commit -m 'Add safe project versions and recovery'
          git push origin HEAD:main
