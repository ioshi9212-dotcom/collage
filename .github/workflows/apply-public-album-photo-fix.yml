name: Apply public album photo fix

on:
  push:
    branches: [fix/public-album-photo-refs]
    paths:
      - 'scripts/apply-public-album-photo-fix.mjs'
      - '.github/workflows/apply-public-album-photo-fix.yml'

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply public album photo fix
        run: node scripts/apply-public-album-photo-fix.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Public album browser test
        run: npx playwright test e2e/public-album-route.spec.js
      - name: Commit verified fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply-public-album-photo-fix.mjs .github/workflows/apply-public-album-photo-fix.yml
          git add server.js server/publicAlbumModel.js server/publicAlbumModel.test.mjs
          git commit -m 'Repair public album photo references'
          git push origin HEAD:fix/public-album-photo-refs
