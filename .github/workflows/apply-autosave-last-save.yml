name: Apply five-minute latest-save autosave

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-autosave-last-save.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply autosave implementation
        run: node scripts/patch-autosave-storage.mjs
      - name: Apply autosave tests
        run: node scripts/patch-autosave-tests.mjs
      - name: Remove one-time patch helpers
        run: git rm scripts/patch-autosave-storage.mjs scripts/patch-autosave-tests.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify save and reopen flow
        run: npx playwright test e2e/editor-persistence.spec.mjs
      - name: Commit verified autosave and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-autosave-last-save.yml
          git add public/project-storage.js src/editor/project-storage.test.mjs
          git commit -m 'Autosave latest local project every five minutes'
          git push
