name: Preserve last frame style after local apply

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-frame-style-last-property-selection.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply selection reset patch
        run: node scripts/patch-frame-style-last-property-selection.mjs
      - name: Remove one-time helper
        run: git rm scripts/patch-frame-style-last-property-selection.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify frame style controls
        run: npx playwright test e2e/frame-style-controls.spec.js
      - name: Commit verified change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-frame-style-last-property-selection.yml
          git add src/AppLive.jsx e2e/frame-style-controls.spec.js
          git commit -m 'Keep last frame style property after local apply'
          git push
