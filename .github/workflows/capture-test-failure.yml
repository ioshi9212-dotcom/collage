name: Capture test failure

on:
  push:
    branches: [agent/cloud-photo-sync-no-base64]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-photo-sync-no-base64
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture npm test output
        run: |
          set +e
          npm test > full-test-failure.txt 2>&1
          echo "exit=$?" >> full-test-failure.txt
          exit 0
      - name: Commit output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add full-test-failure.txt
          git commit -m "Capture current test failure"
          git push origin HEAD:agent/cloud-photo-sync-no-base64
