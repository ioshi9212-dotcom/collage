name: Apply extended collage presets

on:
  push:
    branches: [agent/extended-collage-presets]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/extended-collage-presets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply catalog patch
        run: node .github/scripts/apply-extended-collage-presets.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/editor/collagePresetCatalog.js
          git commit -m "Integrate extended collage presets"
          git push origin HEAD:agent/extended-collage-presets
