name: Apply preview zoom and pan fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preview-zoom-pan-fast.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply preview zoom and pan patch
        run: node scripts/patch-preview-zoom-pan.mjs
      - name: Commit patch and remove one-time helpers
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/patch-preview-zoom-pan.mjs
          git rm .github/workflows/apply-preview-zoom-pan.yml
          git rm .github/workflows/apply-preview-zoom-pan-fast.yml
          git add src/AppLive.jsx
          git commit -m 'Add independent album zoom and pannable preview'
          git push
