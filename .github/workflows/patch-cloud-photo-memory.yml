name: Patch cloud photo memory

on:
  push:
    branches: [agent/cloud-photo-sync-no-base64]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-photo-sync-no-base64
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node .github/scripts/patch-cloud-photo-memory.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppLive.jsx
          git commit -m "Remember uploaded photo keys locally"
          git push origin HEAD:agent/cloud-photo-sync-no-base64
