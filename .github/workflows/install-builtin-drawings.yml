name: Install built-in drawings

on:
  push:
    branches:
      - fix/builtin-drawings
    paths:
      - scripts/builtin-drawings.zip
      - scripts/install-builtin-drawings.py
      - .github/workflows/install-builtin-drawings.yml

permissions:
  contents: write

jobs:
  install-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/builtin-drawings
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install artwork into public catalog
        run: python scripts/install-builtin-drawings.py
      - name: Install dependencies
        run: npm ci
      - name: Verify built-in drawing files
        run: node src/editor/drawingCatalogBuiltin.test.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit verified built-in drawings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add built-in floral drawing library"
          git push origin HEAD:fix/builtin-drawings
