name: Diagnose cloud sync

on:
  push:
    branches: [agent/cloud-photo-sync-no-base64]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-photo-sync-no-base64
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture diagnostics
        run: |
          set +e
          : > cloud-sync-diagnosis.txt
          for command in \
            "node src/editor/cloudPhotoSync.test.mjs" \
            "node server/bucketGateway.test.mjs" \
            "node public/cloud-auth-cloud-sync.test.mjs" \
            "node public/cloud-auth.test.mjs"
          do
            echo "===== $command =====" >> cloud-sync-diagnosis.txt
            bash -lc "$command" >> cloud-sync-diagnosis.txt 2>&1
            echo "exit=$?" >> cloud-sync-diagnosis.txt
          done
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-sync-diagnosis.txt
          git commit -m "Capture cloud sync test diagnostics"
          git push origin HEAD:agent/cloud-photo-sync-no-base64
