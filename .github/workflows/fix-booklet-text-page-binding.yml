name: Fix booklet text page binding

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-booklet-text-page-binding.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Bind text and drawings to stable page IDs
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return text.replace(old, new, 1)

          extra_path = Path('src/editor/extraLayers.js')
          extra = extra_path.read_text()

          extra = replace_once(extra,
          """function sanitizeLayerPage(page, idFactory) {
            const source = objectValue(page) || {};
            return {
              texts: sanitizeLayerList(source.texts, MAX_TEXT_LAYERS_PER_PAGE, sanitizeTextLayer, idFactory),""",
          """function sanitizeLayerPage(page, idFactory) {
            const source = objectValue(page) || {};
            return {
              pageId: cleanString(source.pageId, '', MAX_LAYER_ID_LENGTH),
              texts: sanitizeLayerList(source.texts, MAX_TEXT_LAYERS_PER_PAGE, sanitizeTextLayer, idFactory),""",
          'sanitize pageId')

          old_lookup = """export function textLayersForPage(extraLayers, pageIndex) {
            const pageNumber = pageIndex + 1;
            const page = extraLayers?.pages?.[String(pageNumber)];
            return Array.isArray(page?.texts) ? page.texts : [];
          }

          export function drawingLayersForPage(extraLayers, pageIndex) {
            const pageNumber = pageIndex + 1;
            const page = extraLayers?.pages?.[String(pageNumber)];
            return Array.isArray(page?.drawings) ? page.drawings : [];
          }

          export function createPageLayerDraft(layers, pageNumber) {
            const key = String(pageNumber);
            const next = cloneDeep(layers) || { version: 1, pages: {} };
            if (!next.pages || typeof next.pages !== 'object' || Array.isArray(next.pages)) next.pages = {};
            if (!next.pages[key]) next.pages[key] = { texts: [], drawings: [], templates: [] };
            if (!Array.isArray(next.pages[key].texts)) next.pages[key].texts = [];
            if (!Array.isArray(next.pages[key].drawings)) next.pages[key].drawings = [];
            if (!Array.isArray(next.pages[key].templates)) next.pages[key].templates = [];
            return { next, page: next.pages[key] };
          }
          """

          new_lookup = """function layerPageForPage(extraLayers, pageIndex, pageId = null) {
            const pages = extraLayers?.pages && typeof extraLayers.pages === 'object' ? extraLayers.pages : {};
            const requestedPageId = pageId == null ? '' : String(pageId);
            if (requestedPageId) {
              const byId = Object.values(pages).find((page) => page?.pageId === requestedPageId);
              if (byId) return byId;
            }
            const pageNumber = pageIndex + 1;
            return pages[String(pageNumber)];
          }

          export function textLayersForPage(extraLayers, pageIndex, pageId = null) {
            const page = layerPageForPage(extraLayers, pageIndex, pageId);
            return Array.isArray(page?.texts) ? page.texts : [];
          }

          export function drawingLayersForPage(extraLayers, pageIndex, pageId = null) {
            const page = layerPageForPage(extraLayers, pageIndex, pageId);
            return Array.isArray(page?.drawings) ? page.drawings : [];
          }

          export function bindExtraLayerPagesToPageIds(layers, albumPages = []) {
            const pagesMap = layers?.pages && typeof layers.pages === 'object' && !Array.isArray(layers.pages)
              ? layers.pages
              : {};
            let nextPagesMap = pagesMap;
            let changed = false;

            (Array.isArray(albumPages) ? albumPages : []).forEach((albumPage, index) => {
              const pageId = cleanString(albumPage?.id, '', MAX_LAYER_ID_LENGTH);
              const key = String(index + 1);
              const layerPage = pagesMap[key];
              if (!pageId || !layerPage || layerPage.pageId) return;
              if (!changed) nextPagesMap = { ...pagesMap };
              nextPagesMap[key] = { ...layerPage, pageId };
              changed = true;
            });

            if (!changed) return layers;
            return { ...layers, version: 1, pages: nextPagesMap };
          }

          export function createPageLayerDraft(layers, pageNumber, pageId = null) {
            const key = String(pageNumber);
            const next = cloneDeep(layers) || { version: 1, pages: {} };
            if (!next.pages || typeof next.pages !== 'object' || Array.isArray(next.pages)) next.pages = {};
            if (!next.pages[key]) next.pages[key] = { pageId: '', texts: [], drawings: [], templates: [] };
            const requestedPageId = cleanString(pageId, '', MAX_LAYER_ID_LENGTH);
            if (requestedPageId) next.pages[key].pageId = requestedPageId;
            if (!Array.isArray(next.pages[key].texts)) next.pages[key].texts = [];
            if (!Array.isArray(next.pages[key].drawings)) next.pages[key].drawings = [];
            if (!Array.isArray(next.pages[key].templates)) next.pages[key].templates = [];
            return { next, page: next.pages[key] };
          }
          """
          extra = replace_once(extra, old_lookup, new_lookup, 'page lookup helpers')

          extra = replace_once(extra,
          """export function cloneExtraLayerPage(pageLayers, idFactory = makeLayerId) {
            if (!pageLayers) return null;
            const cloned = cloneDeep(pageLayers);
            ['texts', 'drawings', 'templates'].forEach((key) => {""",
          """export function cloneExtraLayerPage(pageLayers, idFactory = makeLayerId) {
            if (!pageLayers) return null;
            const cloned = cloneDeep(pageLayers);
            delete cloned.pageId;
            ['texts', 'drawings', 'templates'].forEach((key) => {""",
          'clone page identity reset')

          extra_path.write_text(extra)

          app_path = Path('src/AppLive.jsx')
          app = app_path.read_text()
          app = replace_once(app,
          """  ALBUM_LAYERS_KEY,
            ALBUM_MODE_KEY,
            cloneExtraLayerPage,""",
          """  ALBUM_LAYERS_KEY,
            ALBUM_MODE_KEY,
            bindExtraLayerPagesToPageIds,
            cloneExtraLayerPage,""",
          'AppLive import')

          app = replace_once(app,
          """function ExtraPageLayers({
            extraLayers,
            pageIndex,
            x = 0,""",
          """function ExtraPageLayers({
            extraLayers,
            pageIndex,
            pageId = null,
            x = 0,""",
          'ExtraPageLayers pageId prop')

          app = replace_once(app,
          """  const texts = showTexts ? textLayersForPage(extraLayers, pageIndex) : [];
            const allDrawings = drawingLayersForPage(extraLayers, pageIndex);""",
          """  const texts = showTexts ? textLayersForPage(extraLayers, pageIndex, pageId) : [];
            const allDrawings = drawingLayersForPage(extraLayers, pageIndex, pageId);""",
          'ExtraPageLayers pageId lookup')

          app = replace_once(app,
          """  const pages = album.pages;
            const currentPageIndex = Math.max(0, pages.findIndex((page) => page.id === album.currentPageId));
            const currentPage = pages[currentPageIndex] ?? pages[0];""",
          """  const pages = album.pages;
            const currentPageIndex = Math.max(0, pages.findIndex((page) => page.id === album.currentPageId));
            const currentPage = pages[currentPageIndex] ?? pages[0];

            useEffect(() => {
              const bound = bindExtraLayerPagesToPageIds(extraLayers, pages);
              if (bound !== extraLayers) setExtraLayers(bound);
            }, [extraLayers, pages]);""",
          'bind existing layers to page IDs')

          app = replace_once(app,
          """  function activePageNumber() {
              return currentPageIndex + 1;
            }
          """,
          """  function activePageNumber() {
              return currentPageIndex + 1;
            }

            function activePageId() {
              return currentPage?.id ?? null;
            }
          """,
          'active page id helper')

          app = app.replace('createPageLayerDraft(current, activePageNumber())', 'createPageLayerDraft(current, activePageNumber(), activePageId())')

          old_current_layers = """  const currentLayerPageNumber = activePageNumber();
            const currentLayerPage = extraLayers.pages?.[String(currentLayerPageNumber)] || { texts: [], drawings: [] };
            const currentTexts = Array.isArray(currentLayerPage.texts) ? currentLayerPage.texts : [];
            const currentDrawings = Array.isArray(currentLayerPage.drawings) ? currentLayerPage.drawings : [];"""
          new_current_layers = """  const currentTexts = textLayersForPage(extraLayers, currentPageIndex, currentPage?.id ?? null);
            const currentDrawings = drawingLayersForPage(extraLayers, currentPageIndex, currentPage?.id ?? null);"""
          app = replace_once(app, old_current_layers, new_current_layers, 'current layer lookup')

          tag_pattern = re.compile(r'<ExtraPageLayers\b[\s\S]*?/>')
          def bind_tag(match):
              tag = match.group(0)
              if 'pageId=' in tag:
                  return tag
              candidates = [
                  ('pageIndex={entry.pageIndex}', 'pageId={entry.page?.id ?? null}'),
                  ('pageIndex={exportPageIndex}', 'pageId={exportPage?.id ?? null}'),
                  ('pageIndex={pageIndex}', 'pageId={pages[pageIndex]?.id ?? null}'),
                  ('pageIndex={currentPageIndex}', 'pageId={currentPage?.id ?? null}'),
              ]
              for marker, prop in candidates:
                  if marker in tag:
                      return tag.replace(marker, marker + ' ' + prop, 1)
              return tag
          app = tag_pattern.sub(bind_tag, app)

          unbound = [tag for tag in tag_pattern.findall(app) if 'pageIndex=' in tag and 'pageId=' not in tag]
          if unbound:
              raise SystemExit('Unbound ExtraPageLayers tags remain:\n' + '\n'.join(unbound[:5]))

          app_path.write_text(app)

          preview_path = Path('src/editor/AlbumFlipPreviewHost.jsx')
          preview = preview_path.read_text()
          preview = preview.replace(
              'textLayersForPage(project.extraLayers, pageIndex)',
              'textLayersForPage(project.extraLayers, pageIndex, project.pages?.[pageIndex]?.id ?? null)'
          )
          preview = preview.replace(
              'drawingLayersForPage(project.extraLayers, pageIndex)',
              'drawingLayersForPage(project.extraLayers, pageIndex, project.pages?.[pageIndex]?.id ?? null)'
          )
          preview_path.write_text(preview)

          test_path = Path('src/editor/extraLayers.test.mjs')
          test = test_path.read_text()
          test = replace_once(test,
          """  applyAlbumEditorMode,
            cloneExtraLayerPage,""",
          """  applyAlbumEditorMode,
            bindExtraLayerPagesToPageIds,
            cloneExtraLayerPage,""",
          'test import')

          marker = "\nconst appSource = readFileSync(resolve(process.cwd(), 'src/AppLive.jsx'), 'utf8');\n"
          block = r'''
          {
            const legacy = {
              version: 1,
              pages: {
                1: { texts: [{ id: 'a' }], drawings: [] },
                2: { texts: [{ id: 'b' }], drawings: [{ id: 'db' }] },
              },
            };
            const albumPages = [{ id: 'page-a' }, { id: 'page-b' }];
            const bound = bindExtraLayerPagesToPageIds(legacy, albumPages);
            assert.equal(bound.pages[1].pageId, 'page-a');
            assert.equal(bound.pages[2].pageId, 'page-b');
            assert.deepEqual(textLayersForPage(bound, 0, 'page-b'), [{ id: 'b' }], 'stable pageId must beat a stale physical index');
            assert.deepEqual(drawingLayersForPage(bound, 0, 'page-b'), [{ id: 'db' }]);
            assert.equal(bindExtraLayerPagesToPageIds(bound, albumPages), bound, 'already-bound layers must preserve object identity');
          }

          {
            let id = 0;
            const cloned = cloneExtraLayerPage({ pageId: 'original-page', texts: [{ id: 'old' }], drawings: [], templates: [] }, () => `new-${++id}`);
            assert.equal(cloned.pageId, undefined, 'duplicated pages must not inherit the source page identity');
          }
          '''.replace('\n          ', '\n')
          if marker not in test:
              raise SystemExit('test insertion marker missing')
          test = test.replace(marker, '\n' + block + marker, 1)
          test_path.write_text(test)

          integration_path = Path('src/editor/appIntegration.test.mjs')
          integration = integration_path.read_text()
          integration += "\nassert.match(appSource, /bindExtraLayerPagesToPageIds\\(extraLayers, pages\\)/, 'extra layers must be bound to stable page IDs');\n"
          integration += "assert.match(appSource, /pageIndex=\\{entry\\.pageIndex\\} pageId=\\{entry\\.page\\?\\.id \\?\\? null\\}/, 'booklet and spread overlays must resolve extra layers by page ID');\n"
          integration_path.write_text(integration)
          PY
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Booklet regression checks
        run: npx playwright test e2e/booklet-preview-fit.spec.js e2e/booklet-print.spec.js
      - name: Commit verified fix
        shell: bash
        run: |
          rm .github/workflows/fix-booklet-text-page-binding.yml
          git config user.name "ioshi9212-dotcom"
          git config user.email "ioshi9212@gmail.com"
          git add src/AppLive.jsx src/editor/extraLayers.js src/editor/extraLayers.test.mjs src/editor/appIntegration.test.mjs src/editor/AlbumFlipPreviewHost.jsx .github/workflows/fix-booklet-text-page-binding.yml
          git commit -m "Keep text layers attached to booklet pages"
          git push
