name: Apply cloud photo sync

on:
  push:
    branches: [agent/cloud-photo-sync-no-base64]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-photo-sync-no-base64
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: node .github/scripts/apply-cloud-photo-sync.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js server/bucketGateway.js src/AppLive.jsx public/cloud-auth.js
          git commit -m "Integrate bucket photo sync into normal saves"
          git push origin HEAD:agent/cloud-photo-sync-no-base64
