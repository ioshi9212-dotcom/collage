name: Apply page order actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-page-order-actions.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply page order migration
        run: node scripts/apply-page-order-actions.mjs
      - name: Remove one-time migration files
        run: git rm scripts/apply-page-order-actions.mjs .github/workflows/apply-page-order-actions.yml
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run page order browser regression
        run: npx playwright test e2e/page-order-actions.spec.js
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppLive.jsx src/editor/extraLayers.js src/editor/extraLayers.test.mjs src/editor/pageOrder.js src/editor/pageOrder.test.mjs e2e/page-order-actions.spec.js package.json
          git commit -m 'Add page move and swap actions'
          git push
