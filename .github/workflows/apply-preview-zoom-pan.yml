name: Apply preview zoom and pan

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-preview-zoom-pan.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply preview zoom and pan patch
        run: node scripts/patch-preview-zoom-pan.mjs
      - name: Remove one-time patch helper
        run: git rm scripts/patch-preview-zoom-pan.mjs
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify preview zoom and editor smoke
        run: npx playwright test e2e/preview-zoom-pan.spec.mjs e2e/global-history.spec.js
      - name: Commit verified preview controls and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-preview-zoom-pan.yml
          git add src/AppLive.jsx
          git commit -m 'Add independent album zoom and pannable preview'
          git push
