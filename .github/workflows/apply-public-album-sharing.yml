name: Apply public album sharing

on:
  push:
    branches: [main]
    paths:
      - 'scripts/apply-public-album-sharing.mjs'
      - 'scripts/fix-public-album-migration.mjs'
      - '.github/workflows/apply-public-album-sharing.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply public album sharing migration
        run: node scripts/apply-public-album-sharing.mjs
      - name: Fix browser regression fixture
        run: node scripts/fix-public-album-migration.mjs
      - name: Remove one-time migration files
        run: rm scripts/apply-public-album-sharing.mjs scripts/fix-public-album-migration.mjs .github/workflows/apply-public-album-sharing.yml
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run public album browser regression
        run: npx playwright test e2e/public-album-route.spec.js
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add public client album sharing"
          git push
