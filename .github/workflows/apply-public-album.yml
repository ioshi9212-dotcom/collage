name: Apply public album sharing

on:
  push:
    branches:
      - feature/public-album-sharing-20260830

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply public album feature
        run: node scripts/apply-public-album-v2.mjs
      - name: Remove one-time migration files
        run: |
          rm -f scripts/apply-public-album.mjs
          rm -f scripts/apply-public-album-v2.mjs
          rm -f .github/workflows/apply-public-album.yml
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run public album browser regression
        run: npx playwright test e2e/public-album-viewer.spec.js
      - name: Commit feature
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Add public client album sharing"
          git push origin HEAD:${GITHUB_REF_NAME}
