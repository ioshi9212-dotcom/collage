name: Fix public photo request host

on:
  push:
    branches:
      - fix/public-photo-request-host

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply request host fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/bucketGateway.js')
          text = path.read_text()
          old = "const requestUrl = new URL(request.url || '/', `http://${request.headers.host || 'localhost'}`);"
          new = "const requestUrl = new URL(request.url || '/', `http://${request.headers?.host || 'localhost'}`);"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one target, found {text.count(old)}')
          path.write_text(text.replace(old, new))
          PY
      - name: Add regression test
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('server/bucketGateway.test.mjs')
          text = path.read_text()
          marker = "console.log('bucketGateway tests passed');"
          if marker not in text:
              raise SystemExit('bucketGateway test marker not found')
          snippet = r'''

// Public photo delivery uses an internal request object with no headers.
// The download path must therefore tolerate request.headers being absent.
{
  const source = await import('node:fs/promises').then(({ readFile }) => readFile(new URL('./bucketGateway.js', import.meta.url), 'utf8'));
  assert.match(source, /request\.headers\?\.host \|\| 'localhost'/);
}
'''
          if "request.headers?.host || 'localhost'" not in text:
              text = text.replace(marker, snippet + "\n" + marker)
          path.write_text(text)
          PY
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-public-photo-request-host.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bucketGateway.js server/bucketGateway.test.mjs .github/workflows/fix-public-photo-request-host.yml
          git commit -m "Fix public photo delivery request host"
          git push origin HEAD:fix/public-photo-request-host
