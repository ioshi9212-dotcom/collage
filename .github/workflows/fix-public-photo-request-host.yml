name: Public photo host validation

on:
  push:
    branches:
      - "fix/public-photo-request-host"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Patch public photo request
        run: |
          sed -i 's/request\.headers\.host/request.headers?.host/' server/bucketGateway.js
          grep -F "request.headers?.host || 'localhost'" server/bucketGateway.js
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit verified fix
        run: |
          rm .github/workflows/fix-public-photo-request-host.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/bucketGateway.js .github/workflows/fix-public-photo-request-host.yml
          git commit -m "Fix public photo delivery request host"
          git push origin HEAD:fix/public-photo-request-host
