name: Apply global history

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-global-history.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply global history migration
        run: node scripts/apply-global-history.mjs
      - name: Remove one-time migration files
        run: git rm scripts/apply-global-history.mjs .github/workflows/apply-global-history.yml
      - name: Lint
        run: npm run lint
      - name: Unit and integration tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run global history browser regression
        run: npx playwright test e2e/global-history.spec.js
      - name: Commit feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add global undo and redo'
          git push
