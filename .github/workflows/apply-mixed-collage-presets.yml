name: Apply mixed collage presets

on:
  push:
    branches: [agent/mixed-collage-presets]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mixed-collage-presets
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply integration patch
        run: node .github/scripts/apply-mixed-collage-presets.mjs
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppLive.jsx src/editor/collagePresetCatalog.js
          git commit -m "Integrate mixed collage preset picker"
          git push origin HEAD:agent/mixed-collage-presets
